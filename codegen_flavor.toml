# Options du générateur (sa2-nx) pour la vitesse : guide de portage §9.1, docs/OPTIMISATION.md. Inclus par
# opdarkness_manifest.toml ([entrypoint] includes) ; clés à la racine. Elles ne changent que la façon d'écrire le
# C++ (le compilateur garde l'état invité dans des registres de l'hôte, supprime des écritures mortes) : le résultat
# vu par le jeu est le même. Introduites par étapes, chacune mesurée (tools/mesure_instr.sh) et vérifiée (scénario
# de combat, rejeu, captures).
#
# Étape A (2026-10-09) : options sans marque par fonction, les mêmes que l'ensemble de base de sa2-nx
# (app/codegen_flavor.toml) :
#   - cr0-cr7, ctr, xer et la réservation lwarx en variables C++ locales ;
#   - skip_msr : pas de barrières mfmsr/mtmsrd ni de verrou global autour des séquences atomiques (un stwcx. est déjà
#     une comparaison-échange) ;
#   - dform_disp_split : accès mémoire D-form en base + zext(reg) + déplacement ;
#   - fctiwz_inline : fctiwz en conversion directe + sélection NaN ;
#   - fp_moves_modeless : les déplacements de flottants ne changent plus le mode d'arrondi de l'hôte.
# Pas elide_lr_stores : src/od_sommeil.cpp reconnaît les sites des Sleep(0) par ctx.lr.
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fp_moves_modeless = true
#
# Étape B (2026-10-09) : registres non volatils (r14-r31, f14-f31, v14-v31/v64-v127) en variables locales : plus
# d'appels aux fonctions __savegprlr / __restgprlr ni de va-et-vient par la pile invitée pour ces registres.
# Audit : tools/read_before_write.py de sa2-nx **sur le code généré avec l'option** (sur celui de l'étape A, les
# registres s'écrivent ctx.r14... et l'outil ne les voit pas) : 18 fonctions, 2026-10-09. 4 fragments d'exception
# de la bibliothèque C (lisent le r31 de leur propriétaire) : share_registers dans le manifeste ; 7 fonctions
# vectorielles du décodeur (v64/v65/v69/v72) : option ci-dessous ; le reste : chemins du jeu peu probables ou
# effacements (xor r30,r30), laissés.
# Ne jamais marquer share_registers une fonction ordinaire : ses __savegprlr sont supprimés, elle écrase alors les
# registres de ses appelants (essai sur tout le décodeur : écran noir, accès à 0x40 dans sub_823315F8).
non_volatile_as_local = true
# Registres vectoriels non volatils (v14-v31, v64-v127) laissés dans le contexte, avec leurs sauvegardes
# (__savevmx / __restvmx) : le décodeur vidéo du jeu charge des constantes dans v64-v72 (sub_8291E7B8, sub_8291EB00)
# que ses fonctions de calcul vectoriel lisent ensuite (sub_82902A40 : v64, v65 ; sub_82901090... : v69, v72), hors
# convention d'appel. En variables locales, elles lisaient des zéros : vidéo d'introduction brouillée (2026-10-09,
# trouvé par bissection fonction par fonction). Option ajoutée au générateur de sa2-nx (patches/sa2-nx-sdk.patch).
non_volatile_vectors_as_local = false
#
# Étape D (2026-10-14) : options restantes de sa2-nx (docs/OPTIMISATION.md « Étape D »).
# non_argument_as_local : r0, r2, r11, r12, f0 et v32-v63 (registres volatils qui ne portent pas d'argument dans l'ABI
# de la Xbox 360) en variables locales. Audit tools/non_argument_audit.py de sa2-nx sur le code généré sans l'option
# (out/profil/audit_nonarg.txt) : 218 fonctions d'aide __save*/__rest* (gardées par nom par le générateur) ; les
# fonctions ci-dessous gardent ces registres dans le contexte et le générateur les transmet autour de chaque appel :
# toutes celles qui en lisent un à l'entrée (fragments d'exception de la bibliothèque C : r12 ; quelques r11 ; le
# décodeur vidéo, qui fait passer des constantes dans v32-v63 entre ses fonctions, comme v64-v72 plus haut) et toutes
# celles qui en rendent un à leur appelant (sub_82782EF8 : r11 à 34 appelants...).
# 2026-10-14 soir : RETIRÉ (false) : avec l'étape D, 2 plantages sur 10 lancements console (tampon de lecture nul :
# sub_82206878 au démarrage, sub_8232C460 = libération d'un pointeur nul par le fil de lecture), contre 0 sur une
# dizaine sans ; la build LTO plantait aussi dans sub_8232C460. Gain faible : retiré. Les listes restent pour un essai
# ultérieur (une option à la fois).
non_argument_as_local = true
